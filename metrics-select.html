<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrics Select | British Juniors Fantasy League 2026 🇬🇧</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative bg-gray-900 text-white font-sans min-h-screen overflow-x-hidden">

  <div class="fixed inset-0 bg-[url('image_metrics.jpg')] bg-cover bg-center -z-20"></div>
  <div class="fixed inset-0 bg-black/65 -z-10"></div>

  <!-- HEADER -->
  <header class="w-full bg-gray-900/90 backdrop-blur-sm border-b border-gray-800 relative z-50">
    <div class="flex items-center justify-center px-4 py-3">
      <div class="flex-1 text-center">
        <a href="index.html" class="font-bold text-white hover:text-red-500 transition text-sm sm:text-lg md:text-xl lg:text-2xl">
          British Juniors Fantasy League 2026 🇬🇧
        </a>
      </div>

      <div class="absolute right-4 top-1/2 -translate-y-1/2">
        <button id="menu-btn" class="text-gray-300 p-2 rounded-md hover:bg-gray-800/50">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MENU -->
  <div id="mobile-menu" class="fixed top-16 right-4 w-48 bg-gray-900/95 backdrop-blur-sm border border-gray-800 rounded-md shadow-lg z-50 scale-y-0 opacity-0 pointer-events-none origin-top transition duration-300">
    <nav class="flex flex-col py-2 text-white">
      <a href="index.html" class="px-4 py-2 hover:text-red-500 hover:bg-gray-800">Home</a>
      <a href="entry-select.html" class="px-4 py-2 hover:text-red-500 hover:bg-gray-800">League Entry</a>
      <a href="leaderboard-select.html" class="px-4 py-2 hover:text-red-500 hover:bg-gray-800">Leaderboard</a>
      <a href="accuracy-select.html" class="px-4 py-2 hover:text-red-500 hover:bg-gray-800">Accuracy Scores</a>
      <a href="metrics-select.html" class="px-4 py-2 hover:text-red-500 hover:bg-gray-800">Metrics</a>
    </nav>
  </div>

  <!-- CONTENT -->
  <main class="min-h-screen flex flex-col justify-center items-center px-6 text-center gap-7">
    <h1 class="text-[28px] font-bold">Metrics</h1>
    <div class="text-sm opacity-75">Select your division</div>

    <div class="flex flex-col gap-4 w-full max-w-xs">
      <a href="metrics-juniors.html" class="rounded-full px-5 py-4 bg-white/10 border border-white/15 backdrop-blur-md font-semibold hover:bg-white/20 transition">
        Juniors Metrics
      </a>

      <a href="metrics-subjuniors.html" class="rounded-full px-5 py-4 bg-white/10 border border-white/15 backdrop-blur-md font-semibold hover:bg-white/20 transition">
        Sub-Juniors Metrics
      </a>
    </div>
  </main>

  <script>
    const menuBtn = document.getElementById("menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");
    let open = false;

    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      open = !open;
      mobileMenu.classList.toggle("opacity-100", open);
      mobileMenu.classList.toggle("scale-y-100", open);
      mobileMenu.classList.toggle("scale-y-0", !open);
      mobileMenu.classList.toggle("pointer-events-none", !open);
    });

    document.addEventListener("click", (e) => {
      if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
        open = false;
        mobileMenu.classList.remove("opacity-100", "scale-y-100");
        mobileMenu.classList.add("opacity-0", "scale-y-0", "pointer-events-none");
      }
    });
  </script>
</body>
</html>
