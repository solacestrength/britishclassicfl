<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>League Entry</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      color: #fff;
      overflow-x: hidden;
    }

    /* ========= BACKGROUND ========= */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('image_entry.jpg') center / cover no-repeat;
      z-index: -2;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: -1;
    }

    /* ========= NAVBAR ========= */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .nav-title {
      font-weight: 700;
      font-size: 18px;
      text-align: center;
      pointer-events: none;
    }

    .menu-btn {
      position: absolute;
      right: 16px;
      top: 12px;

      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 14px;

      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
      color: #fff;
      cursor: pointer;
    }

    /* ========= MOBILE MENU ========= */
    .mobile-menu {
      position: fixed;
      top: 72px;
      left: 0;
      width: 100%;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 99;

      transform-origin: top;
      transition: 0.22s ease;
    }

    .mobile-menu a,
    .nav-dropdown-toggle {
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;

      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
    }

    .nav-dropdown-menu {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
      padding-left: 8px;
    }

    .nav-dropdown.open .nav-dropdown-menu {
      display: flex;
    }

    .scale-y-0 { transform: scaleY(0); opacity: 0; pointer-events: none; }
    .scale-y-100 { transform: scaleY(1); opacity: 1; }

    /* ========= LAYOUT ========= */
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      gap: 28px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 320px;
    }

    .pill-btn {
      display: block;
      padding: 16px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      text-align: center;

      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;

      transition: all 0.18s ease;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .pill-btn:active {
      transform: scale(0.98);
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.75;
    }

  </style>
</head>

<body>

  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="nav-title">
      British Juniors Fantasy League 2026 🇬🇧
    </div>

    <div id="menu-btn" class="menu-btn">☰</div>
  </div>

  <!-- MOBILE MENU -->
  <div id="mobile-menu" class="mobile-menu scale-y-0">
    <a href="index.html">Home</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="accuracy_scores.html">Accuracy Scores</a>
    <a href="metrics.html">Metrics</a>

    <div class="nav-dropdown">
      <div class="nav-dropdown-toggle">League Entry ▾</div>
      <div class="nav-dropdown-menu">
        <a href="entry-select.html">Select Division</a>
        <a href="entry.html">Full Entry</a>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="container">
    <h1>League Entry</h1>
    <div class="subtitle">Select your division</div>

    <div class="button-group">
      <a href="entry-juniors.html" class="pill-btn">Juniors</a>
      <a href="entry-subjuniors.html" class="pill-btn">Sub-Juniors</a>
    </div>
  </div>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    let menuVisible = false;

    function toggleMenu(show) {
      mobileMenu.classList.toggle('scale-y-100', show);
      mobileMenu.classList.toggle('scale-y-0', !show);
    }

    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuVisible = !menuVisible;
      toggleMenu(menuVisible);
    });

    document.addEventListener('click', (e) => {
      if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
        menuVisible = false;
        toggleMenu(false);
      }
    });

    document.querySelectorAll('.nav-dropdown-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const parent = btn.closest('.nav-dropdown');
        parent.classList.toggle('open');
      });
    });
  </script>

</body>
</html>
